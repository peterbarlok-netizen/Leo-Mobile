<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">LEO – Cyber Lion</title><desc id="desc">Majestätischer goldener Löwe mit leuchtenden türkisfarbenen Augen in einem holografischen Energiering.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#103b49"/><stop offset=".55" stop-color="#071b28"/><stop offset="1" stop-color="#030a12"/></radialGradient>
 <radialGradient id="mane" cx="50%" cy="38%" r="65%"><stop stop-color="#ffe8a5"/><stop offset=".35" stop-color="#e9a84d"/><stop offset=".7" stop-color="#8d4d20"/><stop offset="1" stop-color="#27150f"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b8"/><stop offset=".38" stop-color="#e5a344"/><stop offset=".7" stop-color="#8a4b1e"/><stop offset="1" stop-color="#f8ce78"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0c8"/><stop offset=".45" stop-color="#d99a51"/><stop offset="1" stop-color="#75401e"/></linearGradient>
 <linearGradient id="eye"><stop stop-color="#00fff0"/><stop offset=".5" stop-color="#24cfff"/><stop offset="1" stop-color="#00a5b7"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
